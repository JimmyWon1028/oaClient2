; oaClient2 settings: UTF-8. Place Config.ini beside oaClient2.exe.
[SysSet]
; Leave blank to show the welcome page; confirm an HTTP or HTTPS server URL there.
HomeUrl=
HomePage=
ClearCache=Y
Locale=zh-TW
; Relative paths are resolved from the main executable directory.
ReptoolPath=prg/Reptool.exe
ReptoolConfigIni=

[Window]
Width=1200
Height=850
; The main window always starts maximized. This records the last close state.
Maximized=Y

[UserSet]
ZoomPercent=100
