<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>W28 合成表單</title>
<style>
  body { font: 20px sans-serif; margin: 40px; }
  label { display: block; margin: 16px 0; }
  input, button { font: inherit; padding: 8px; }
</style>
<h1>W28 密碼提示測試</h1>
<p>僅本機合成資料，沒有真實帳號或驗證程序；伺服器丟棄表單內容。</p>
<form method="post" action="/submit">
  <label>合成帳號 <input name="username" autocomplete="username" value="w28-synthetic"></label>
  <label>合成密碼 <input name="password" type="password" autocomplete="current-password" value="synthetic-only-123"></label>
  <button type="submit">送出合成表單</button>
  <button type="button" id="ajax">送出 AJAX 合成表單</button>
</form>
<script>
  //2026.10.13 modify by codex, exercise native and AJAX submissions without using real credentials.
  document.getElementById('ajax').onclick = async () => {
    const response = await fetch('/ajax-submit', {
      method: 'POST', body: new URLSearchParams(new FormData(document.querySelector('form')))
    });
    if (response.ok) {
      document.querySelector('form').remove();
      document.querySelector('h1').textContent = 'AJAX 合成表單已送出';
      document.title = 'W28 AJAX Submitted';
    }
  };
  function doLogout() { console.log('loginState=0'); }
</script>
</html>
